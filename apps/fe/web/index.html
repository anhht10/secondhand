<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ReMarket — Chợ đồ cũ sinh viên thông minh & minh bạch tích hợp AI.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ReMarket">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ReMarket — Chợ đồ cũ thông minh &amp; minh bạch</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    #remarket-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 20% 20%, #EFF6FF 0%, #F8FAFC 55%, #EEF2FF 100%);
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #remarket-splash.fade-out {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 440px;
      width: 100%;
      text-align: center;
      animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .welcome-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #DBEAFE;
      color: #1E40AF;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(26, 86, 219, 0.08);
    }

    .logo-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 22px;
    }

    .logo-box {
      width: 96px;
      height: 96px;
      border-radius: 26px;
      background: linear-gradient(135deg, #1A56DB 0%, #3B82F6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 36px -8px rgba(26, 86, 219, 0.38);
      animation: logoFloat 2.6s ease-in-out infinite;
    }

    .ai-badge {
      position: absolute;
      right: -6px;
      bottom: -6px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%);
      border: 3px solid #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 15px;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.35);
    }

    .brand-title {
      font-size: 34px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.6px;
      margin-bottom: 8px;
    }

    .brand-greeting {
      font-size: 16px;
      font-weight: 600;
      color: #1A56DB;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 14px;
      line-height: 1.5;
      color: #64748B;
      margin-bottom: 24px;
    }

    .feature-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 30px;
    }

    .feature-chip {
      padding: 6px 12px;
      border-radius: 10px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }

    .progress-track {
      width: 220px;
      height: 6px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      width: 45%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #1A56DB, #6366F1);
      animation: progressSlide 1.3s ease-in-out infinite;
    }

    .loading-text {
      font-size: 13px;
      font-weight: 500;
      color: #64748B;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes progressSlide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(240%); }
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="remarket-splash">
    <div class="splash-card">
      <div class="welcome-pill">
        <span>👋</span>
        <span>CHÀO MỪNG ĐẾN VỚI REMARKET</span>
      </div>

      <div class="logo-wrapper">
        <div class="logo-box">
          <!-- Storefront SVG icon -->
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l1.5-5h15L21 9"/>
            <path d="M3 9c0 1.66 1.34 3 3 3s3-1.34 3-3c0 1.66 1.34 3 3 3s3-1.34 3-3c0 1.66 1.34 3 3 3s3-1.34 3-3"/>
            <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>
            <path d="M10 16h4v5h-4z"/>
          </svg>
        </div>
        <div class="ai-badge" title="Tích hợp Gemini AI">✨</div>
      </div>

      <h1 class="brand-title">ReMarket</h1>
      <p class="brand-greeting">Chợ đồ cũ sinh viên thông minh &amp; minh bạch</p>
      <p class="brand-subtitle">
        Trao đổi giáo trình, thiết bị điện tử và đồ dùng học tập an toàn cùng Trợ lý AI
      </p>

      <div class="feature-chips">
        <span class="feature-chip">🤖 Định giá Gemini AI</span>
        <span class="feature-chip">🛡️ Kiểm duyệt minh bạch</span>
        <span class="feature-chip">💬 Chat &amp; Blog cộng đồng</span>
      </div>

      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
      <p class="loading-text">Đang khởi tạo ứng dụng, vui lòng đợi giây lát...</p>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('remarket-splash');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 480);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
